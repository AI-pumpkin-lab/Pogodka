<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Погодка</title>
<meta name="theme-color" content="#FCE3C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Погодка">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root { --bg: #FCE3C8; --fg: #3B2A22; --card: rgba(255,255,255,0.45); --hl: rgba(59,42,34,0.25); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
    transition: background-color .6s ease, color .6s ease;
  }
  main {
    max-width: 520px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .header { width: 100%; display: flex; align-items: center; justify-content: space-between; }
  .city { font-size: 20px; font-weight: 600; }
  .refresh { font-size: 24px; width: 36px; height: 36px; border-radius: 50%; }
  .refresh.spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #scene { width: 100%; aspect-ratio: 340 / 220; display: block; cursor: pointer; }
  .bubble { background: var(--card); border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 17px; text-align: center; }
  .temp { text-align: center; }
  .temp .big { font-size: 72px; font-weight: 600; line-height: 1.05; }
  .temp .cond { font-size: 20px; }
  .temp .sub { font-size: 14px; opacity: .8; margin-top: 4px; }
  .cards { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { background: var(--card); border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px; }
  .card.wide { grid-column: 1 / -1; }
  .card .ic { font-size: 22px; }
  .card .t { font-size: 12px; opacity: .7; }
  .card .v { font-size: 15px; font-weight: 600; }
  .row { width: 100%; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .row::-webkit-scrollbar { display: none; }
  .hour { flex: 0 0 62px; background: var(--card); border-radius: 16px; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .hour .l { font-size: 12px; } .hour .e { font-size: 20px; } .hour .v { font-size: 15px; font-weight: 600; }
  .play { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .play .top { display: flex; justify-content: space-between; font-size: 12px; }
  .play .top span { opacity: .7; } .play .top button { font-weight: 600; }
  .chip { flex: 0 0 auto; background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .chip.on { background: var(--hl); }
  .error { background: var(--card); border-radius: 16px; padding: 16px; text-align: center; }
  .foot { font-size: 11px; opacity: .6; margin-top: 8px; }
  .foot a { color: inherit; }
  .hidden { display: none !important; }
  /* выбор города */
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center; padding: calc(env(safe-area-inset-top) + 40px) 16px 16px; z-index: 10; }
  .panel { width: 100%; max-width: 420px; background: #FFFAF4; color: #3B2A22; border-radius: 22px; padding: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  .panel h2 { margin: 0 0 12px; font-size: 18px; }
  .panel input { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #E6CFB2; outline: none; background: #fff; color: inherit; }
  .panel input:focus { border-color: #E67E2E; }
  .results { margin-top: 8px; max-height: 50vh; overflow-y: auto; }
  .results button { display: block; width: 100%; text-align: left; padding: 10px 4px; border-bottom: 1px solid #F2E6D8; }
  .results small { display: block; color: #8a7a70; font-size: 12px; }
  .hint { color: #8a7a70; font-size: 14px; padding: 10px 4px; }
  .close { margin-top: 12px; width: 100%; padding: 12px; border-radius: 12px; background: #F6E7D2; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="header">
    <button class="city" id="cityBtn">📍 Москва ▾</button>
    <button class="refresh" id="refreshBtn" aria-label="Обновить">↻</button>
  </div>

  <canvas id="scene" role="img" aria-label="Тыковка и грибочек"></canvas>
  <div class="bubble" id="phrase">…</div>

  <div class="temp hidden" id="tempBlock">
    <div class="big" id="tempNow"></div>
    <div class="cond" id="cond"></div>
    <div class="sub" id="tempSub"></div>
  </div>

  <div class="cards hidden" id="cards">
    <div class="card"><span class="ic">💨</span><div><div class="t">Ветер</div><div class="v" id="wind"></div></div></div>
    <div class="card"><span class="ic">💧</span><div><div class="t">Влажность</div><div class="v" id="hum"></div></div></div>
    <div class="card wide"><span class="ic" id="tipIc"></span><div><div class="t">Что надеть</div><div class="v" id="tip"></div></div></div>
  </div>

  <div class="error hidden" id="error"></div>
  <div class="row hidden" id="hours"></div>

  <div class="play">
    <div class="top"><span>Посмотреть все сцены</span><button id="resetBtn" class="hidden">Вернуть настоящую погоду</button></div>
    <div class="row" id="chips"></div>
  </div>

  <div class="foot">Погода: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo.com</a></div>
</main>

<div class="sheet hidden" id="sheet">
  <div class="panel">
    <h2>Где смотрим погоду?</h2>
    <input id="search" placeholder="Например, Казань" autocomplete="off" enterkeyhint="search">
    <div class="results" id="results"><div class="hint">Начни вводить название города</div></div>
    <button class="close" id="closeBtn">Закрыть</button>
  </div>
</div>

<script>
// ═══ Сцены ═══════════════════════════════════════════════════════════════
const SCENES = {
  sunny:  { title: "Солнце", emoji: "☀️", bg: "#FCE3C8", phrases: ["Тепло! Идём собирать листики?", "Солнышко! Подставляем щёчки", "Идеальная погода для прогулки"] },
  cloudy: { title: "Ветер",  emoji: "🍃", bg: "#DCE3EA", phrases: ["Держи шляпку крепче!", "Облачка бегут, и мы с ними", "Ветрено, надень шарфик"] },
  rain:   { title: "Дождь",  emoji: "🌧️", bg: "#CFE0F0", phrases: ["Ура, дождик! Бежим в лужи!", "Сапожки надеты, мы готовы", "Чем больше лужа, тем веселее"] },
  cocoa:  { title: "Какао",  emoji: "☕", bg: "#E6D3DC", phrases: ["Время какао", "Плед, какао и сериальчик?", "Прохладно, давай греться"] },
  snow:   { title: "Снег",   emoji: "❄️", bg: "#3E4E78", phrases: ["Снег! Какао с маршмеллоу", "Одевайся теплее, тут сугробы", "Слепим снеговика?"], dark: true },
  heat:   { title: "Жара",   emoji: "🔥", bg: "#FFE2B8", phrases: ["Жарко! Пей водичку", "Тыковка загорает, грибочек тает", "Ищем тенёк и мороженое"] },
  storm:  { title: "Гроза",  emoji: "⛈️", bg: "#4A5578", phrases: ["Гроза… давай обнимемся", "Посидим дома, ладно?", "Бум! Мы не боимся… почти"], dark: true },
  night:  { title: "Ночь",   emoji: "🌙", bg: "#2E3A5C", phrases: ["Сладких снов", "Тсс, мы спим", "Звёздочки сегодня яркие"], dark: true },
};

// Выбор сцены. Порядок проверок важен: сначала самое «яркое».
function pickScene(code, temp, isDay, wind, hour) {
  if ([95, 96, 99].includes(code)) return "storm";
  if ([71, 73, 75, 77, 85, 86].includes(code)) return "snow";
  if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return "rain";
  if (temp <= 10 && ([3, 45, 48].includes(code) || (hour >= 18 && hour <= 22))) return "cocoa";
  if (!isDay) return "night";
  if (temp >= 25) return "heat";
  if (wind >= 8 || code === 2 || code === 3) return "cloudy";
  return "sunny";
}

function conditionText(code) {
  const map = { 0: "Ясно", 1: "Почти ясно", 2: "Переменная облачность", 3: "Пасмурно", 45: "Туман", 48: "Туман",
    51: "Морось", 53: "Морось", 55: "Морось", 56: "Морось", 57: "Морось",
    61: "Дождь", 63: "Дождь", 65: "Дождь", 66: "Дождь", 67: "Дождь",
    71: "Снег", 73: "Снег", 75: "Снег", 77: "Снег", 80: "Ливень", 81: "Ливень", 82: "Ливень",
    85: "Снегопад", 86: "Снегопад", 95: "Гроза", 96: "Гроза", 99: "Гроза" };
  return map[code] || "Погодка";
}

function clothingTip(t) {
  if (t < -10) return ["🧤", "Максимум слоёв, шапка и варежки"];
  if (t < 0) return ["🧣", "Шапка, шарф и тёплая куртка"];
  if (t < 10) return ["🧥", "Куртка и шарфик"];
  if (t < 18) return ["🧶", "Свитер или лёгкая куртка"];
  if (t < 25) return ["👕", "Футболка-погода"];
  return ["🧢", "Панамка и бутылка воды"];
}

const fmt = v => { const r = Math.round(v) || 0; return r > 0 ? `+${r}°` : `${r}°`; };

// ═══ Рисование ═══════════════════════════════════════════════════════════
// Сцена рисуется в «виртуальном» поле 340×220 и масштабируется под экран.
const W = 340, H = 220;
const PX = 112, PY = 158, MX = 236, MY = 160;   // где стоят тыковка и грибочек

const C = {
  ink: "#3B2A22", blush: "#F59A92", tongue: "#F07C84",
  pumpkin: "#E67E2E", pumpkinShade: "#D06A22", pumpkinLight: "#F5994A", pumpkinShine: "#FBB876", pumpkinFeet: "#C9621E",
  stem: "#6B4A2B", leaf: "#7DA35A",
  stemCream: "#F6E7D2", stemShade: "#E6CFB2", mushroomFeet: "#D9BE9C",
  cap: "#E0705A", capUnder: "#B9503B", capShine: "#EE937D", dots: "#FFF1DE",
  boots: "#F7C531", bootsDark: "#E8AE1A", cocoa: "#7A4A30", mugCream: "#FFF3E2", mugBand: "#F2A33A",
  mugRed: "#D9534A", mugRedDark: "#C9473E", marsh: "#F9D3DC", plaid: "#C9584B", plaidLine: "#E9897C",
  moon: "#F6E7B0", sweat: "#8FC4F0", mist: "#C9D3EA",
};

let g; // текущий контекст рисования
const paths = {};
const P = d => paths[d] || (paths[d] = new Path2D(d));   // Path2D понимает SVG-пути из эскизов как есть

function ell(cx, cy, rx, ry, col) { if (rx <= 0 || ry <= 0) return; g.fillStyle = col; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function circ(x, y, r, col) { ell(x, y, r, r, col); }
function rect(x, y, w, h, col, r = 0) {
  r = Math.min(r, w / 2, h / 2); g.fillStyle = col; g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h);
  g.fill();
}
function shape(d, col) { g.fillStyle = col; g.fill(typeof d === "string" ? P(d) : d); }
function line(d, col, w = 2) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = "round"; g.lineJoin = "round"; g.stroke(typeof d === "string" ? P(d) : d); }
function quad(x0, y0, cx, cy, x1, y1) { const p = new Path2D(); p.moveTo(x0, y0); p.quadraticCurveTo(cx, cy, x1, y1); return p; }
function poly(pts, close = false) { const p = new Path2D(); p.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) p.lineTo(pts[i], pts[i + 1]); if (close) p.closePath(); return p; }
function fade(a, fn) { g.save(); g.globalAlpha *= Math.max(0, Math.min(1, a)); fn(); g.restore(); }
function at(x, y, s, rot, fn) { g.save(); g.translate(x, y); if (rot) g.rotate(rot); g.scale(s, s); fn(); g.restore(); }

// ─── Мордочки ───
function face(f, eyeDX, eyeR, blushDX, blushY, blushRX, blushRY, blink) {
  if (f.blush === "both" || f.blush === "left") ell(-blushDX, blushY, blushRX, blushRY, C.blush);
  if (f.blush === "both" || f.blush === "right") ell(blushDX, blushY, blushRX, blushRY, C.blush);
  let eyes = f.eyes;
  if (blink && (eyes === "open" || eyes === "wide")) eyes = "flat";
  for (const side of [-1, 1]) {
    const x = side * eyeDX;
    if (eyes === "open" || eyes === "wide") {
      const r = eyes === "wide" ? eyeR * 1.2 : eyeR;
      circ(x, 0, r, C.ink); circ(x + r * .38, -r * .38, r * .37, "#fff"); circ(x - r * .3, r * .45, r * .17, "#fff");
    } else if (eyes === "happy") line(quad(x - 5, 1, x, -5, x + 5, 1), C.ink, 2.6);
    else if (eyes === "sleepy") line(quad(x - 5, 0, x, 5, x + 5, 0), C.ink, 2.4);
    else if (eyes === "squint") line(poly([x + 5 * side, -5, x - 4 * side, 0, x + 5 * side, 5]), C.ink, 2.5);
    else if (eyes === "flat") line(quad(x - 5, 1, x, 1, x + 5, 1), C.ink, 2.5);
  }
  switch (f.mouth) {
    case "smile": line(quad(-5, 11, 0, 16, 5, 11), C.ink, 2); break;
    case "cat": line("M-5 11 Q-2.5 14.5 0 11 Q2.5 14.5 5 11", C.ink, 1.8); break;
    case "grin": shape("M-8 9 Q0 23 8 9Z", C.ink); ell(0, 13.5, 3.2, 1.8, C.tongue); break;
    case "o": ell(0, 13, 3, 3.5, C.ink); break;
    case "wavy": line("M-6 13 Q-3 10 0 13 Q3 16 6 13", C.ink, 2); break;
    case "sad": line(quad(-5, 14, 0, 10, 5, 14), C.ink, 2); break;
    case "snore": ell(0, 14, 2.5 * (f.snore || 1), 3 * (f.snore || 1), C.ink); break;
  }
}

// ─── Тыковка: (x, y) — центр тела ───
function pumpkin(x, y, f, o = {}) {
  const arms = o.arms || [[-50, 16], [50, 16]];
  at(x, y, 0.85, 0, () => {
    if (o.boots) {
      rect(-24, 30, 16, 16, C.boots, 5); rect(8, 30, 16, 16, C.boots, 5);
      rect(-24, 30, 16, 5, C.bootsDark, 2.5); rect(8, 30, 16, 5, C.bootsDark, 2.5);
    } else { ell(-12, 36, 8, 4.5, C.pumpkinFeet); ell(12, 36, 8, 4.5, C.pumpkinFeet); }
    ell(-24, 2, 28, 30, C.pumpkin); ell(24, 2, 28, 30, C.pumpkin);
    ell(38, 6, 10, 22, C.pumpkinShade); ell(0, 0, 30, 34, C.pumpkinLight); ell(-14, -20, 6, 10, C.pumpkinShine);
    shape("M-4 -32 Q-5 -42 0 -48 L6 -46 Q2 -40 4 -32Z", C.stem);
    shape("M4 -40 Q18 -54 30 -44 Q16 -34 4 -40Z", C.leaf);
    for (const [ax, ay] of arms) ell(ax, ay, 8, 5.5, C.pumpkin);
    face(f, 10, 6.5, 21, 12, 7, 4, o.blink);
    if (o.extras) o.extras();
  });
}

// ─── Грибочек: (x, y) — центр мордочки на ножке ───
function mushroom(x, y, f, o = {}) {
  const arms = o.arms || [[-24, 12], [24, 12]];
  at(x, y, 0.85, 0, () => {
    if (o.boots) {
      rect(-20, 28, 15, 16, C.boots, 5); rect(5, 28, 15, 16, C.boots, 5);
      rect(-20, 28, 15, 5, C.bootsDark, 2.5); rect(5, 28, 15, 5, C.bootsDark, 2.5);
    } else { ell(-10, 33, 8, 4.5, C.mushroomFeet); ell(10, 33, 8, 4.5, C.mushroomFeet); }
    shape("M-20 30 Q-24 -14 -15 -26 L15 -26 Q24 -14 20 30 Q0 36 -20 30Z", C.stemCream);
    shape("M8 -24 Q22 -12 18 30 Q12 33 6 33 Q16 -2 8 -24Z", C.stemShade);
    shape("M-46 -22 Q-46 -76 0 -78 Q46 -76 46 -22 Q0 -12 -46 -22Z", C.cap);
    shape("M-42 -22 Q0 -8 42 -22 Q0 -2 -42 -22Z", C.capUnder);
    ell(-22, -60, 14, 6, C.capShine);
    circ(-26, -42, 6, C.dots); circ(4, -62, 8, C.dots); circ(30, -44, 5.5, C.dots); circ(12, -30, 3.5, C.dots);
    for (const [ax, ay] of arms) ell(ax, ay, 7, 5, C.stemCream);
    face(f, 9, 6, 18, 11, 6, 3.5, o.blink);
    if (o.extras) o.extras();
  });
}

// ─── Помощники ───
const blink = (t, off) => (t + off) % 4.2 < 0.14;
function rnd(i, salt) { const v = Math.sin((i * 127 + salt * 311) * 12.9898) * 43758.5453; return v - Math.floor(v); }
const ground = col => ell(170, 202, 160, 14, col);
function cloud(x, y, s, col) { ell(x, y, 26 * s, 11 * s, col); ell(x + 16 * s, y - 6 * s, 16 * s, 10 * s, col); ell(x - 12 * s, y - 3 * s, 12 * s, 8 * s, col); }
function flower(x, y) {
  line(quad(x, y + 4, x + 1, y + 9, x, y + 14), C.leaf, 1.5);
  for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2; circ(x + Math.cos(a) * 3.5, y + Math.sin(a) * 3.5, 2.8, "#FFF6E6"); }
  circ(x, y, 2.2, "#F2B63A");
}
function sparkle(x, y, s, col) { const k = s * .3; shape(poly([x, y - s, x + k, y - k, x + s, y, x + k, y + k, x, y + s, x - k, y + k, x - s, y, x - k, y - k], true), col); }
function heart(x, y) { at(x, y, 1, 0, () => shape("M0 6 C-8 0 -8 -9 -3 -9 C-1 -9 0 -7 0 -5.5 C0 -7 1 -9 3 -9 C8 -9 8 0 0 6Z", "#F28B8B")); }
function crescent(x, y, r, bg) { circ(x, y, r, C.moon); circ(x + r * .5, y - r * .42, r * .92, bg); }
function teardrop(x, y, col) { const p = new Path2D(); p.moveTo(x, y - 6); p.quadraticCurveTo(x - 7, y + 4, x, y + 5); p.quadraticCurveTo(x + 7, y + 4, x, y - 6); shape(p, col); }
function rainDrops(t, count, col, speed) {
  const p = new Path2D();
  for (let i = 0; i < count; i++) {
    const x = rnd(i, 1) * 360 - 10, sp = speed * (0.8 + rnd(i, 3) * 0.4);
    const y = (rnd(i, 2) * 240 + t * sp) % 240 - 20;
    p.moveTo(x, y); p.lineTo(x - 3, y + 10);
  }
  line(p, col, 2);
}
function snowflakes(t, count) {
  for (let i = 0; i < count; i++) {
    const speed = 16 + rnd(i, 4) * 22;
    const y = (rnd(i, 5) * 235 + t * speed) % 235 - 10;
    const x = rnd(i, 6) * 340 + Math.sin(t * .8 + i) * 6;
    circ(x, y, 1.4 + rnd(i, 7) * 1.6, "#fff");
  }
}
function splash(x, jump, spread) {
  if (jump >= 5) return;
  fade(1 - jump / 5, () => {
    for (const side of [-1, 1]) {
      at(x + side * spread, 188, 1, side * .45, () => ell(0, 0, 3, 4.5, "#8FB0D6"));
      at(x + side * (spread + 9), 178, 1, side * .6, () => ell(0, 0, 2.2, 3.4, "#8FB0D6"));
    }
  });
}
function steam(x, y, h, t) {
  const w = Math.sin(t * 2.2 + x) * 2, p = new Path2D();
  p.moveTo(x, y);
  p.quadraticCurveTo(x - 4 + w, y - h / 4, x, y - h / 2);
  p.quadraticCurveTo(x + 4 - w, y - h * 3 / 4, x, y - h);
  fade(.85, () => line(p, "#fff", 2));
}
function zzz(x, y, t) {
  for (let i = 0; i < 3; i++) {
    const ph = (t * .35 + i / 3) % 1, s = 4 + ph * 5, zx = x + ph * 16, zy = y - ph * 46;
    fade(Math.sin(ph * Math.PI), () => line(poly([zx, zy, zx + s, zy, zx, zy + s, zx + s, zy + s]), C.mist, 1.5));
  }
}

// ─── 8 сцен ───
const DRAW = {
  // ☀️ Солнце: гуляют, между ними сердечко
  sunny(t) {
    const sun = "#FFC96B", rays = new Path2D();
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2 + t * .3;
      rays.moveTo(300 + Math.cos(a) * 22, 40 + Math.sin(a) * 22); rays.lineTo(300 + Math.cos(a) * 28, 40 + Math.sin(a) * 28);
    }
    line(rays, sun, 2.5); circ(300, 40, 16 + Math.sin(t * 1.5), sun);
    [[40, 44], [262, 70], [66, 84]].forEach(([x, y], i) => fade(.4 + .6 * Math.abs(Math.sin(t * 1.8 + i * 2)), () => sparkle(x, y, 5, "#fff")));
    ground("#F2CDA6"); flower(36, 190); flower(306, 188);
    const b = Math.sin(t * 2) * 1.2;
    pumpkin(PX, PY + b, { eyes: "open", mouth: "cat", blush: "both" }, { arms: [[-50, 16], [54, 10]], blink: blink(t, 0) });
    mushroom(MX, MY - b, { eyes: "open", mouth: "smile", blush: "both" }, { arms: [[-26, 8], [24, 12]], blink: blink(t, 1.7) });
    heart(186, 142 + Math.sin(t * 2.5) * 3);
  },

  // 🍃 Ветер: держат шляпки, мимо летят листики
  cloudy(t) {
    for (let i = 0; i < 3; i++) cloud((i * 140 + t * (8 + i * 5)) % 440 - 50, 26 + (i % 2) * 18, 1 + i * .15, "#F4F7FA");
    for (let i = 0; i < 3; i++) {
      const ph = (t * .5 + i / 3) % 1, x = -60 + ph * 420, y = 70 + i * 28, p = new Path2D();
      p.moveTo(x, y); p.quadraticCurveTo(x + 30, y - 6, x + 50, y); p.quadraticCurveTo(x + 62, y + 4, x + 56, y + 10);
      fade(Math.sin(ph * Math.PI), () => line(p, "#A9B6C4", 1.8));
    }
    ground("#C5CFDA");
    const sw = Math.sin(t * 3) * 1.5;
    pumpkin(PX + sw, PY, { eyes: "open", mouth: "o", blush: "both" }, { arms: [[-50, 16], [46, -18]], blink: blink(t, .4) });
    mushroom(MX + sw * .6, MY, { eyes: "open", mouth: "smile", blush: "both" }, { arms: [[-48, -24], [48, -24]], blink: blink(t, 2.1) });
    ["#E58A4E", "#F2B63A", "#C9584B", "#7DA35A"].forEach((col, i) => {
      const x = (t * 70 + i * 110) % 440 - 50, y = 60 + (i % 2) * 34 + Math.sin(t * 2.5 + i) * 10;
      at(x, y, 1, t * 2 + i, () => ell(0, 0, 6, 3, col));
    });
  },

  // 🌧 Дождь: прыгают по лужам в жёлтых сапожках
  rain(t) {
    const cc = "#B7CCE3"; ell(60, 14, 46, 14, cc); ell(96, 8, 30, 12, cc); ell(270, 12, 54, 14, cc); ell(238, 6, 28, 10, cc);
    rainDrops(t, 34, "#7FA2CC", 230);
    const water = "#C4D8EE";
    ell(170, 202, 152, 15, "#9FBDE0");
    line(quad(60, 200, 95, 196, 130, 200), water, 2); line(quad(210, 206, 245, 202, 280, 206), water, 2);
    [60, 175, 300].forEach((x, i) => {
      const ph = (t * .7 + i / 3) % 1, r = 3 + ph * 14, p = new Path2D();
      p.ellipse(x, 204, r, r * .3, 0, 0, Math.PI * 2);
      fade(1 - ph, () => line(p, water, 1.5));
    });
    const pj = Math.abs(Math.sin(t * 3.2)) * 16, mj = Math.abs(Math.sin(t * 3.2 + 1.3)) * 16;
    ell(PX, 202, 30 - pj * .6, 5, "#86A8D2"); ell(MX, 202, 26 - mj * .6, 5, "#86A8D2");
    splash(PX, pj, 36); splash(MX, mj, 32);
    pumpkin(PX, PY - pj, { eyes: "happy", mouth: "grin", blush: "both" }, { arms: [[-54, -22], [54, -22]], boots: true });
    mushroom(MX, MY - mj, { eyes: "happy", mouth: "grin", blush: "both" }, { arms: [[-28, 2], [28, 2]], boots: true });
  },

  // ☕ Какао-вечер: гирлянда, туман, кружечки
  cocoa(t) {
    [[14, 70, 80], [282, 96, 48], [20, 124, 30]].forEach(([x, y, w], i) => rect(x + Math.sin(t * .4 + i) * 8, y, w, 7, "#F4EAEF", 3.5));
    line(quad(0, 22, 170, 56, 340, 22), "#9A8592", 1);
    [40, 100, 170, 240, 300].forEach((bx, i) => {
      const u = bx / 340, by = 22 + 68 * u * (1 - u) + 3, glow = .55 + .45 * Math.sin(t * 2 + i * 1.3);
      fade(glow * .35, () => circ(bx, by, 8, "#FFD27A")); fade(.6 + glow * .4, () => circ(bx, by, 4, "#FFD27A"));
    });
    ground("#D5BCC8");
    const s = Math.sin(t * 1.3);
    pumpkin(PX, PY + s, { eyes: "happy", mouth: "smile", blush: "left" }, { arms: [[-50, 16]], extras: () => {
      line("M38 8 Q46 12 38 17", C.mugCream, 3); rect(18, 3, 20, 20, C.mugCream, 4); rect(18, 13, 20, 4, C.mugBand);
      ell(28, 4, 9, 2.5, C.cocoa); ell(18, 16, 6, 5, C.pumpkin);
      steam(25, -2, 20, t); steam(31, -2, 14, t + 1);
    } });
    mushroom(MX, MY - s, { eyes: "happy", mouth: "smile", blush: "right" }, { arms: [[24, 12]], extras: () => {
      line("M-40 6 Q-48 10 -40 15", C.mugRedDark, 3); rect(-40, 1, 18, 18, C.mugRed, 4);
      circ(-35, 9, 1.8, C.dots); circ(-27, 13, 1.8, C.dots); circ(-28, 6, 1.3, C.dots);
      ell(-31, 2, 8, 2.3, C.cocoa); ell(-21, 12, 6, 5, C.stemCream);
      steam(-33, -3, 12, t + .5);
    } });
  },

  // ❄️ Снег: под одним пледом, какао с маршмеллоу
  snow(t) {
    crescent(300, 34, 12, SCENES.snow.bg);
    snowflakes(t, 46);
    const sc = "#EEF3FA"; ell(170, 206, 175, 20, sc); ell(36, 192, 36, 12, sc); ell(304, 192, 36, 12, sc);
    const b = Math.sin(t * 1.4) * .8;
    pumpkin(PX, PY + b, { eyes: "happy", mouth: "smile", blush: "left" }, { arms: [], extras: () => ell(2, -47, 7, 3.2, "#fff") });
    mushroom(MX, MY - b, { eyes: "happy", mouth: "smile", blush: "right" }, { arms: [], extras: () =>
      shape("M-34 -64 Q-24 -82 0 -83 Q24 -82 34 -64 Q26 -70 17 -67 Q8 -73 -2 -68 Q-14 -73 -23 -67 Q-29 -69 -34 -64Z", "#fff") });
    shape("M52 178 Q174 166 296 178 L298 200 Q174 206 50 200Z", C.plaid);
    const st = new Path2D();
    for (let x = 84; x <= 284; x += 40) { const u = (x - 52) / 244; st.moveTo(x, 178 - 24 * u * (1 - u) + 1.5); st.lineTo(x, 200 + 12 * u * (1 - u) - 1.5); }
    st.addPath(quad(54, 189, 174, 183, 296, 189));
    line(st, C.plaidLine, 2.5);
    line("M160 153 Q168 157 160 162", C.mugCream, 3); rect(140, 148, 20, 20, C.mugCream, 4); rect(140, 158, 20, 4, C.mugBand);
    ell(150, 149, 9, 2.5, C.cocoa); rect(143, 143, 7, 6, "#fff", 2); rect(150, 141, 7, 6, C.marsh, 2); rect(146, 138, 6, 5, "#fff", 2);
    ell(140, 162, 6, 5, C.pumpkin); steam(152, 134, 12, t);
    line("M192 155 Q184 159 192 164", C.mugRedDark, 3); rect(192, 150, 18, 18, C.mugRed, 4);
    circ(197, 161, 1.8, C.dots); circ(205, 164, 1.8, C.dots); ell(201, 151, 8, 2.3, C.cocoa);
    rect(194, 145, 7, 6, C.marsh, 2); rect(201, 144, 7, 6, "#fff", 2); ell(211, 162, 6, 5, C.stemCream);
    fade(.4 + .6 * Math.abs(Math.sin(t * 2)), () => sparkle(176, 140, 4, "#FFD27A"));
  },

  // 🔥 Жара: тыковка в очках, грибочек тает с эскимо
  heat(t) {
    const sun = "#FFB84D", rays = new Path2D();
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2 + t * .4;
      rays.moveTo(290 + Math.cos(a) * 25, 44 + Math.sin(a) * 25); rays.lineTo(290 + Math.cos(a) * 33, 44 + Math.sin(a) * 33);
    }
    line(rays, sun, 3); circ(290, 44, 20 + Math.sin(t * 2) * 1.2, sun); circ(290, 44, 13, "#FFCB6B");
    [[14, 70], [16, 84], [300, 104]].forEach(([wx, wy], i) => {
      const pts = []; for (let k = 0; k <= 10; k++) pts.push(wx + k * 3, wy + Math.sin(k * .8 + t * 4 + i) * 2);
      line(poly(pts), "#F2B072", 1.5);
    });
    ground("#F5C98E");
    const gl = "#2B2B33";
    pumpkin(PX, PY, { eyes: "open", mouth: "grin", blush: "both" }, { extras: () => {
      rect(-20, -7, 16, 11, gl, 4); rect(4, -7, 16, 11, gl, 4); line(quad(-4, -3, 0, -3, 4, -3), gl, 2.5);
      rect(-17, -5, 5, 2.5, "#6A6A78", 1.2); rect(7, -5, 5, 2.5, "#6A6A78", 1.2);
    } });
    const drip = (t * .6) % 1;
    mushroom(MX, MY, { eyes: "flat", mouth: "sad", blush: "left" }, { arms: [[-24, 12]], extras: () => {
      fade(1 - drip, () => teardrop(-25, -12 + drip * 10, C.sweat));
      rect(27, 10, 4, 16, "#D9B07A", 2); rect(21, -16, 16, 28, "#F59AB8", 7); rect(21, -16, 16, 9, "#F9C3D3", 4.5);
      fade(1 - drip, () => ell(24, 13 + drip * 8, 2, 2.6, "#F59AB8"));
      ell(22, 14, 6, 5, C.stemCream);
    } });
  },

  // ⛈ Гроза: молния, дрожат, но вместе
  storm(t) {
    const cyc = t % 5, flash = cyc < .18 || (cyc > .3 && cyc < .4), cc = "#6A7499";
    ell(40, 16, 40, 14, cc); ell(110, 12, 46, 15, cc); ell(185, 18, 40, 13, cc); ell(260, 12, 50, 15, cc); ell(322, 18, 30, 12, cc);
    rainDrops(t, 30, "#8FA6D0", 300);
    if (flash) shape("M58 22 L44 52 L54 52 L42 80 L70 44 L58 44 L68 22Z", "#FFD84D");
    ground("#3A4466");
    const fear = cyc < 1 ? 2 : .7;
    pumpkin(PX + Math.sin(t * 38) * fear, PY, { eyes: "squint", mouth: "wavy", blush: "both" }, { arms: [[-50, 16], [54, 10]], extras: () => {
      line("M-58 -10 L-64 -8", C.mist, 2); line("M-58 4 L-65 4", C.mist, 2);
    } });
    mushroom(MX + Math.sin(t * 34 + 1) * fear, MY, { eyes: "wide", mouth: "wavy", blush: "both" },
      { arms: [[-26, 8], [24, 12]], blink: blink(t, .9), extras: () => teardrop(27, -8, C.sweat) });
    if (flash) fade(.18, () => rect(-20, -20, 380, 260, "#fff"));
  },

  // 🌙 Ночь: спят, звёздочки мигают, летят Zzz
  night(t) {
    crescent(300, 36, 13, SCENES.night.bg);
    for (let i = 0; i < 16; i++) {
      const x = rnd(i, 8) * 330 + 5, y = rnd(i, 9) * 95 + 6;
      if (x > 280 && y < 60) continue;
      fade(.35 + .65 * Math.abs(Math.sin(t * 1.1 + i * 1.7)), () => circ(x, y, 1.1 + rnd(i, 10) * 1.1, "#fff"));
    }
    fade(.5 + .5 * Math.abs(Math.sin(t * .9)), () => sparkle(70, 30, 5, C.moon));
    ground("#243050");
    const b = Math.sin(t * 1.5);
    pumpkin(PX, PY + b, { eyes: "sleepy", mouth: "snore", blush: "both", snore: 1 + .25 * Math.sin(t * 1.5) }, { extras: () => {
      shape("M-22 -28 Q-14 -60 30 -68 Q14 -52 22 -28Z", "#6C8EBF"); rect(-25, -34, 50, 10, "#F4F0F8", 5); circ(31, -68, 6, "#F4F0F8");
    } });
    mushroom(MX, MY - b * .6, { eyes: "sleepy", mouth: "smile", blush: "both" });
    zzz(150, 112, t); zzz(276, 92, t + 1.3);
  },
};

// ═══ Анимация ════════════════════════════════════════════════════════════
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
const t0 = performance.now();

function frame(now) {
  const dpr = window.devicePixelRatio || 1;
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  if (canvas.width !== Math.round(cw * dpr) || canvas.height !== Math.round(ch * dpr)) {
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  }
  g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, canvas.width, canvas.height);
  const s = Math.min(cw / W, ch / H) * dpr;
  g.setTransform(s, 0, 0, s, (canvas.width - W * s) / 2, (canvas.height - H * s) / 2);
  g.globalAlpha = 1;
  DRAW[shownScene()]((now - t0) / 1000);
  requestAnimationFrame(frame);
}

// ═══ Состояние и погода ══════════════════════════════════════════════════
const MOSCOW = { name: "Москва", lat: 55.7558, lon: 37.6173, subtitle: "Россия" };
const state = { city: loadCity(), scene: "sunny", preview: null, phraseIndex: Math.floor(Math.random() * 30), loading: false };
const $ = id => document.getElementById(id);
const shownScene = () => state.preview || state.scene;

function loadCity() {
  try { const c = JSON.parse(localStorage.getItem("pogodka.city")); if (c && c.name) return c; } catch (e) {}
  return MOSCOW;
}
function saveCity(c) { try { localStorage.setItem("pogodka.city", JSON.stringify(c)); } catch (e) {} }
const hourOf = s => parseInt(s.slice(11, 13), 10) || 12;

async function refresh() {
  state.loading = true; $("refreshBtn").classList.add("spin"); $("error").classList.add("hidden");
  const c = state.city;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}` +
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day,relative_humidity_2m" +
    "&hourly=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min" +
    "&wind_speed_unit=ms&timezone=auto&forecast_days=2";
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    render(await res.json());
  } catch (e) {
    $("error").textContent = "Не получилось загрузить погоду. Проверь интернет и обнови";
    $("error").classList.remove("hidden");
  } finally {
    state.loading = false; $("refreshBtn").classList.remove("spin");
  }
}

function render(d) {
  const cur = d.current;
  state.scene = pickScene(cur.weather_code, cur.temperature_2m, cur.is_day === 1, cur.wind_speed_10m, hourOf(cur.time));
  $("tempNow").textContent = fmt(cur.temperature_2m);
  $("cond").textContent = conditionText(cur.weather_code);
  const lo = d.daily?.temperature_2m_min?.[0], hi = d.daily?.temperature_2m_max?.[0];
  $("tempSub").textContent = `Ощущается как ${fmt(cur.apparent_temperature)}` + (lo != null && hi != null ? `   ↓${fmt(lo)}  ↑${fmt(hi)}` : "");
  $("wind").textContent = `${Math.round(cur.wind_speed_10m)} м/с`;
  $("hum").textContent = `${Math.round(cur.relative_humidity_2m)}%`;
  const [ic, tip] = clothingTip(cur.temperature_2m);
  $("tipIc").textContent = ic; $("tip").textContent = tip;
  $("tempBlock").classList.remove("hidden"); $("cards").classList.remove("hidden");

  // 12 часов вперёд, начиная с текущего
  const h = d.hourly, now = cur.time.slice(0, 13);
  const start = h.time.findIndex(x => x.slice(0, 13) >= now);
  const box = $("hours"); box.innerHTML = "";
  if (start >= 0) {
    for (let i = start; i < Math.min(start + 12, h.time.length); i++) {
      const hr = hourOf(h.time[i]);
      const sc = pickScene(h.weather_code[i], h.temperature_2m[i], h.is_day[i] === 1, 0, hr);
      const el = document.createElement("div"); el.className = "hour";
      el.innerHTML = `<span class="l">${i === start ? "Сейчас" : String(hr).padStart(2, "0") + ":00"}</span><span class="e">${SCENES[sc].emoji}</span><span class="v">${fmt(h.temperature_2m[i])}</span>`;
      box.appendChild(el);
    }
    box.classList.remove("hidden");
  }
  applyScene();
}

function applyScene() {
  const sc = SCENES[shownScene()];
  const root = document.documentElement.style;
  root.setProperty("--bg", sc.bg);
  root.setProperty("--fg", sc.dark ? "#ffffff" : "#3B2A22");
  root.setProperty("--card", sc.dark ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.45)");
  root.setProperty("--hl", sc.dark ? "rgba(255,255,255,0.25)" : "rgba(59,42,34,0.25)");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", sc.bg);
  $("phrase").textContent = sc.phrases[state.phraseIndex % sc.phrases.length];
  $("cityBtn").textContent = `📍 ${state.city.name} ▾`;
  $("resetBtn").classList.toggle("hidden", !state.preview);
  document.querySelectorAll(".chip").forEach(ch => ch.classList.toggle("on", ch.dataset.scene === state.preview));
}

// ═══ Кнопки ══════════════════════════════════════════════════════════════
for (const [key, sc] of Object.entries(SCENES)) {
  const b = document.createElement("button"); b.className = "chip"; b.dataset.scene = key;
  b.textContent = `${sc.emoji} ${sc.title}`;
  b.onclick = () => { state.preview = state.preview === key ? null : key; applyScene(); };
  $("chips").appendChild(b);
}
$("resetBtn").onclick = () => { state.preview = null; applyScene(); };
canvas.onclick = () => { state.phraseIndex++; applyScene(); };
$("refreshBtn").onclick = () => { if (!state.loading) refresh(); };

// выбор города
let searchTimer = null;
$("cityBtn").onclick = () => { $("sheet").classList.remove("hidden"); $("search").value = ""; $("search").focus(); };
$("closeBtn").onclick = () => $("sheet").classList.add("hidden");
$("sheet").onclick = e => { if (e.target === $("sheet")) $("sheet").classList.add("hidden"); };
$("search").oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const q = $("search").value.trim(), box = $("results");
    if (q.length < 2) { box.innerHTML = '<div class="hint">Начни вводить название города</div>'; return; }
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=ru&format=json`);
      const list = (await r.json()).results || [];
      box.innerHTML = list.length ? "" : '<div class="hint">Ничего не нашлось</div>';
      for (const it of list) {
        const sub = [it.admin1, it.country].filter(Boolean).join(", ");
        const b = document.createElement("button");
        b.innerHTML = `${it.name}<small></small>`; b.querySelector("small").textContent = sub;
        b.onclick = () => {
          state.city = { name: it.name, lat: it.latitude, lon: it.longitude, subtitle: sub };
          saveCity(state.city); $("sheet").classList.add("hidden"); applyScene(); refresh();
        };
        box.appendChild(b);
      }
    } catch (e) { box.innerHTML = '<div class="hint">Не получилось поискать, проверь интернет</div>'; }
  }, 350);
};

// обновлять погоду, когда возвращаешься в приложение
document.addEventListener("visibilitychange", () => { if (!document.hidden && !state.loading) refresh(); });

// офлайн-режим: сохраняем само приложение в кэш
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

applyScene();
requestAnimationFrame(frame);
refresh();
</script>
